<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוסטר | דוח מדיה ופרסום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --orange:#ff6900; --amber:#fcb900; --ink:#1c1c1e; --muted:#6b7280;
    --line:#eceef1; --bg:#f4f5f7; --card:#ffffff; --meta:#1877F2; --google:#34A853;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Assistant',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}
  header{background:linear-gradient(120deg,#ff6900 0%,#fcb900 100%);padding:24px 0 20px}
  .head-in{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .head-l{display:flex;align-items:center;gap:16px}
  header img{height:38px}
  .head-l h1{color:#fff;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .head-l p{color:rgba(255,255,255,.9);font-size:14px;font-weight:600}
  .period-box{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .period-box label{color:rgba(255,255,255,.9);font-size:12px;font-weight:700;padding-inline-start:4px}
  .period{background:#fff;border:none;color:var(--ink);font-family:inherit;font-size:16px;font-weight:800;
    padding:11px 16px;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:240px}
  .period-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;font-weight:600;
    border-radius:10px;padding:8px 14px;margin:16px 0 0}
  .sec-t{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--muted);
    letter-spacing:.3px;margin:26px 4px 12px}
  .sec-t::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--orange)}
  .cmp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .cmp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px}
  .cmp.total{background:var(--ink);border-color:var(--ink)}
  .cmp .name{font-size:15px;font-weight:800;margin-bottom:6px}
  .cmp.total .name{color:#fff}
  .cmp .big{font-size:28px;font-weight:800;letter-spacing:-1px}
  .cmp.total .big{color:#fff}
  .cmp .split{margin-top:12px;display:flex;gap:7px}
  .pill{flex:1;background:var(--bg);border-radius:10px;padding:7px 8px;text-align:center}
  .cmp.total .pill{background:rgba(255,255,255,.1)}
  .pill .k{font-size:11px;font-weight:700;color:var(--muted)}
  .cmp.total .pill .k{color:rgba(255,255,255,.7)}
  .pill .v{font-size:14px;font-weight:800}
  .cmp.total .pill .v{color:#fff}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-start:5px;vertical-align:middle}
  .plat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .panel-h .pl{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800}
  .panel-h .tot{font-size:19px;font-weight:800}
  table{width:100%;border-collapse:collapse}
  td,th{padding:10px 18px;text-align:right;font-size:14px}
  th{font-size:12px;color:var(--muted);font-weight:700;background:#fafbfc}
  tbody tr{border-top:1px solid var(--line)}
  .c-name{font-weight:700}
  .tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);margin-inline-start:6px;white-space:nowrap}
  .tag.ono{background:#fff2e6;color:#c25400}
  .tag.raa{background:#e7f3ff;color:#1560bd}
  .tag.all{background:#eef7ee;color:#2e7d32}
  .c-spend{font-weight:800;white-space:nowrap}
  .c-sub{color:var(--muted);font-size:13px;white-space:nowrap}
  .empty{padding:22px 18px;color:var(--muted);font-size:14px;text-align:center}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
  .chart-wrap{position:relative;height:260px}
  footer{margin-top:30px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
  footer b{color:var(--ink)}
  @media(max-width:820px){.cmp-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:720px){.plat-grid{grid-template-columns:1fr}}
  @media(max-width:480px){.cmp-grid{grid-template-columns:1fr}.head-l h1{font-size:19px}.period{min-width:200px}}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="head-l">
      <img src="logo.png" alt="Booster">
      <div>
        <h1>דוח מדיה ופרסום</h1>
        <p>הוצאות קמפיינים לפי פלטפורמה ומתחם</p>
      </div>
    </div>
    <div class="period-box">
      <label for="period">בחירת תקופה</label>
      <select class="period" id="period" onchange="render()"></select>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="period-note" id="pnote"></div>

  <div class="sec-t">סיכום לפי מתחם</div>
  <div class="cmp-grid" id="compounds"></div>

  <div class="sec-t">פירוט לפי פלטפורמה</div>
  <div class="plat-grid" id="platforms"></div>

  <div class="sec-t">התפלגות ההוצאה</div>
  <div class="chart-card"><div class="chart-wrap"><canvas id="chart"></canvas></div></div>

  <footer>
    מקור הנתונים: חשבונות הפרסום של בוסטר (Google Ads + Meta), עודכן לאחרונה <b id="updated"></b>.<br>
    "כללי" = קמפיינים החוצים כמה מתחמים (קרוסלה, מותג). הסכומים כוללים מע"מ כפי שמדווח בפלטפורמות.
  </footer>
</div>

<script>
/* ===== נתונים שנמשכו מהלוקר, פר חודש (2026). ניתן לרענון. ===== */
const DATA = {
  updated: "12 באוגוסט 2026",
  order: ["all","aug","jul","jun","may"],
  periods: {
    all: { label:"כל התקופה (מאי–אוגוסט 2026)", note:"סיכום מצטבר של מאי עד אוגוסט 2026.",
      meta:[
        {name:"בוסטר אונו - קר", cmp:"אונו", spend:3371.55, clicks:2589},
        {name:"בוסטר אונו - ca", cmp:"אונו", spend:2163.07, clicks:1777},
        {name:"טראפיק אונו", cmp:"אונו", spend:1203.19, clicks:1845},
        {name:"בוסטר אונו", cmp:"אונו", spend:540.51, clicks:374},
        {name:"פוסט אונו 0607", cmp:"אונו", spend:199.93, clicks:229},
        {name:"פוסט אונו 0607 (עותק)", cmp:"אונו", spend:199.40, clicks:644},
        {name:"רעננה LEADGEN מאי 2026", cmp:"רעננה", spend:4025.61, clicks:1152},
        {name:"בוסטר רעננה לידים", cmp:"רעננה", spend:521.07, clicks:215},
        {name:"בוסטר רעננה לידים - leadgen", cmp:"רעננה", spend:336.83, clicks:24},
        {name:"בוסטר רעננה לידים - רימרקטינג", cmp:"רעננה", spend:152.89, clicks:37},
        {name:"קרוסלת מתחמים", cmp:"כללי", spend:2930.21, clicks:792},
        {name:"קמפיין לידים כללי", cmp:"כללי", spend:202.10, clicks:65},
        {name:"קמפיינים נוספים", cmp:"כללי", spend:22.01, clicks:4},
      ],
      google:[
        {name:"בוסטר רעננה קמפיין חיפוש", cmp:"רעננה", spend:10621.02, clicks:1361},
        {name:"חיפוש אונו", cmp:"אונו", spend:8919.30, clicks:540},
        {name:"Demand Gen אונו", cmp:"אונו", spend:1403.62, clicks:1542},
        {name:"קידום כל המתחמים (BOTP)", cmp:"כללי", spend:427.40, clicks:171},
      ] },
    aug: { label:"אוגוסט 2026 (החודש)", note:"החודש הנוכחי, נכון ל-12 באוגוסט. מתעדכן עד סוף החודש.",
      meta:[
        {name:"בוסטר אונו - ca", cmp:"אונו", spend:1093.05, clicks:469},
        {name:"בוסטר אונו - קר", cmp:"אונו", spend:1072.29, clicks:481},
        {name:"רעננה LEADGEN מאי 2026", cmp:"רעננה", spend:538.12, clicks:170},
      ],
      google:[
        {name:"חיפוש אונו", cmp:"אונו", spend:2898.32, clicks:88},
        {name:"בוסטר רעננה קמפיין חיפוש", cmp:"רעננה", spend:800.37, clicks:58},
      ] },
    jul: { label:"יולי 2026 (חודש שעבר)", note:"",
      meta:[
        {name:"בוסטר אונו - קר", cmp:"אונו", spend:2299.26, clicks:1108},
        {name:"טראפיק אונו", cmp:"אונו", spend:1170.99, clicks:1799},
        {name:"בוסטר אונו - ca", cmp:"אונו", spend:1070.02, clicks:655},
        {name:"בוסטר אונו", cmp:"אונו", spend:524.94, clicks:359},
        {name:"פוסט אונו 0607", cmp:"אונו", spend:199.93, clicks:229},
        {name:"פוסט אונו 0607 (עותק)", cmp:"אונו", spend:199.40, clicks:644},
        {name:"רעננה LEADGEN מאי 2026", cmp:"רעננה", spend:1244.15, clicks:305},
        {name:"קרוסלת מתחמים", cmp:"כללי", spend:85.11, clicks:11},
        {name:"קמפיינים נוספים", cmp:"כללי", spend:22.01, clicks:4},
      ],
      google:[
        {name:"חיפוש אונו", cmp:"אונו", spend:6020.98, clicks:223},
        {name:"בוסטר רעננה קמפיין חיפוש", cmp:"רעננה", spend:2929.79, clicks:153},
        {name:"Demand Gen אונו", cmp:"אונו", spend:1403.62, clicks:1542},
        {name:"קידום כל המתחמים (BOTP)", cmp:"כללי", spend:427.40, clicks:171},
      ] },
    jun: { label:"יוני 2026", note:"",
      meta:[
        {name:"קרוסלת מתחמים", cmp:"כללי", spend:1499.60, clicks:395},
        {name:"רעננה LEADGEN מאי 2026", cmp:"רעננה", spend:1489.54, clicks:480},
        {name:"קמפיין לידים כללי", cmp:"כללי", spend:202.10, clicks:65},
        {name:"טראפיק אונו", cmp:"אונו", spend:32.20, clicks:46},
        {name:"בוסטר אונו", cmp:"אונו", spend:15.57, clicks:15},
      ],
      google:[
        {name:"בוסטר רעננה קמפיין חיפוש", cmp:"רעננה", spend:3487.94, clicks:266},
      ] },
    may: { label:"מאי 2026", note:"",
      meta:[
        {name:"קרוסלת מתחמים", cmp:"כללי", spend:1345.50, clicks:386},
        {name:"רעננה LEADGEN מאי 2026", cmp:"רעננה", spend:753.80, clicks:197},
        {name:"בוסטר רעננה לידים", cmp:"רעננה", spend:521.07, clicks:215},
        {name:"בוסטר רעננה לידים - leadgen", cmp:"רעננה", spend:336.83, clicks:24},
        {name:"בוסטר רעננה לידים - רימרקטינג", cmp:"רעננה", spend:152.89, clicks:37},
      ],
      google:[
        {name:"בוסטר רעננה קמפיין חיפוש", cmp:"רעננה", spend:3402.92, clicks:471},
      ] },
  }
};

const NIS = n => Math.round(n).toLocaleString('he-IL') + " ₪";
const NIS2 = n => n.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}) + " ₪";
const CMP_ORDER = ["אונו","רעננה","כללי"];
const CMP_LABEL = {"אונו":"מתחם אונו","רעננה":"מתחם רעננה","כללי":"כלל המתחמים"};
const CMP_CLASS = {"אונו":"ono","רעננה":"raa","כללי":"all"};
let chart;

function build(){
  const sel = document.getElementById('period');
  sel.innerHTML = DATA.order.map(k=>`<option value="${k}">${DATA.periods[k].label}</option>`).join('');
  document.getElementById('updated').textContent = DATA.updated;
  render();
}

function render(){
  const p = DATA.periods[document.getElementById('period').value];
  const note = document.getElementById('pnote');
  if(p.note){ note.style.display='block'; note.textContent = p.note; } else { note.style.display='none'; }

  const all = [...p.meta.map(x=>({...x,plat:'meta'})), ...p.google.map(x=>({...x,plat:'google'}))];
  const byCmp = {}; CMP_ORDER.forEach(c=>byCmp[c]={meta:0,google:0});
  all.forEach(x=>{ if(!byCmp[x.cmp]) byCmp[x.cmp]={meta:0,google:0}; byCmp[x.cmp][x.plat]+=x.spend; });
  const cmpsWith = CMP_ORDER.filter(c=>byCmp[c] && (byCmp[c].meta+byCmp[c].google)>0);
  const gMeta = p.meta.reduce((s,x)=>s+x.spend,0);
  const gGoogle = p.google.reduce((s,x)=>s+x.spend,0);

  let html = cmpsWith.map(c=>{
    const t = byCmp[c].meta+byCmp[c].google;
    return `<div class="cmp">
      <div class="name">${CMP_LABEL[c]}</div>
      <div class="big">${NIS(t)}</div>
      <div class="split">
        <div class="pill"><div class="k"><span class="dot" style="background:var(--meta)"></span>מטא</div><div class="v">${NIS(byCmp[c].meta)}</div></div>
        <div class="pill"><div class="k"><span class="dot" style="background:var(--google)"></span>גוגל</div><div class="v">${NIS(byCmp[c].google)}</div></div>
      </div></div>`;
  }).join('');
  html += `<div class="cmp total">
      <div class="name">סה"כ מדיה</div>
      <div class="big">${NIS(gMeta+gGoogle)}</div>
      <div class="split">
        <div class="pill"><div class="k">מטא</div><div class="v">${NIS(gMeta)}</div></div>
        <div class="pill"><div class="k">גוגל</div><div class="v">${NIS(gGoogle)}</div></div>
      </div></div>`;
  document.getElementById('compounds').innerHTML = html;

  document.getElementById('platforms').innerHTML =
    platPanel("מטא (Meta)", "var(--meta)", p.meta, gMeta) +
    platPanel("גוגל (Google Ads)", "var(--google)", p.google, gGoogle);

  drawChart(cmpsWith, byCmp);
}

function platPanel(title, color, rows, total){
  const sorted = [...rows].sort((a,b)=>b.spend-a.spend);
  const body = sorted.length ? sorted.map(x=>`<tr>
      <td><span class="c-name">${x.name}</span><span class="tag ${CMP_CLASS[x.cmp]||''}">${x.cmp}</span></td>
      <td class="c-sub">${x.clicks.toLocaleString('he-IL')} קליקים</td>
      <td class="c-spend">${NIS2(x.spend)}</td>
    </tr>`).join('') : '';
  const table = sorted.length
    ? `<table><thead><tr><th>קמפיין</th><th>פעילות</th><th>הוצאה</th></tr></thead><tbody>${body}</tbody></table>`
    : `<div class="empty">אין פעילות בתקופה זו</div>`;
  return `<div class="panel">
    <div class="panel-h">
      <div class="pl"><span class="dot" style="background:${color};width:11px;height:11px"></span>${title}</div>
      <div class="tot">${NIS(total)}</div>
    </div>${table}</div>`;
}

function drawChart(cmps, byCmp){
  const ctx = document.getElementById('chart');
  if(chart) chart.destroy();
  chart = new Chart(ctx,{
    type:'bar',
    data:{ labels:cmps.map(c=>CMP_LABEL[c]),
      datasets:[
        {label:'מטא', data:cmps.map(c=>Math.round(byCmp[c].meta)), backgroundColor:'#1877F2', borderRadius:6, barPercentage:.7},
        {label:'גוגל', data:cmps.map(c=>Math.round(byCmp[c].google)), backgroundColor:'#34A853', borderRadius:6, barPercentage:.7},
      ] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'top', labels:{font:{family:'Assistant',size:14,weight:'700'}, usePointStyle:true, pointStyle:'circle'}},
        tooltip:{rtl:true, bodyFont:{family:'Assistant'}, titleFont:{family:'Assistant'},
          callbacks:{label:c=>' '+c.dataset.label+': '+c.raw.toLocaleString('he-IL')+' ₪'}} },
      scales:{ x:{stacked:true, grid:{display:false}, ticks:{font:{family:'Assistant',size:14,weight:'700'}}},
        y:{stacked:true, ticks:{font:{family:'Assistant'}, callback:v=>v.toLocaleString('he-IL')+' ₪'}, grid:{color:'#eceef1'}} }
    }
  });
}
build();
</script>
</body>
</html>
